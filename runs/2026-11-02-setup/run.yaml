    facade: "facade_server.py identical to repo, contract v75"
    deps: unchanged (deploy receipt)
    skillpacks: "45 bundled + 3 user, all loaded; capability packs installed"
    mybrain: "4c73cc9 = origin/develop, clean"

runtime_after_restart:
