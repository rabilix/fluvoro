  code_current: true
  basis: "deploy receipt 2026-11-02T12:08:40Z: eefbbeb8, previous 8fbb1980, 9 files, tests passed, verification stale; restart 12:08:48Z"
  autonomous_loop: "off per conf; the running process does not report it (/health, server.log), evidence tier: config"
  amplify: "off as well: AUTONOMOUS_LOOP_ENABLED gates the whole flywheel incl. Amplify notes (flexcore/amplify.py:14, runtime.py:1138); Phase 1 turns run without Amplify"

decisions:                     # maintainer, 2026-11-02
  - id: D-01
    question: real installation or a separate core
    chosen: real installation (new project, own collection and board)
    rules_out: separate core on a spare port with its own data root
  - id: D-02
    question: what to do with the accidental '--help' department
    chosen: remove it from the store (direct SQL, exactly 1 row, approved statement)
    rules_out: keeping it as evidence; overrides the cloud session's later advice not to touch the DB
  - id: D-03
    question: department for the project
    chosen: engineering (project fluvoro, display name "Fluvoro gutter-outlet shredder")
    rules_out: customer-projects, simulation, and the cloud session's fluvoro-dept / "Fluvoro (synthetic project)"
  - id: D-04
    question: ingest location and scope
    chosen: copy into ~/Sandbox/knowledge_base/fluvoro, ingest with --dept engineering --project fluvoro
    rules_out: ~/fluvoro-input outside FILES_ALLOWED_ROOT; ingest without ACL stamps
  - id: D-05
    question: whose plan to follow after the cloud session's message
    chosen: keep the decisions taken here; treat the cloud session's further items (tenant + API key, facade, myBrain profile) as proposals, each asked before writing
    rules_out: redoing dept/project to the cloud session's ids
  - id: D-06
    question: learning loops during the run
    chosen: disable the autonomous loop for the run (AUTONOMOUS_LOOP_ENABLED=false + core restart), re-enable afterwards
    rules_out: IMPROVEMENT_LOOP_DRY_RUN=true (no effect in propose mode, see F-003); leaving it on and cleaning up afterwards
  - id: D-07
    question: which of the remaining proposals to prepare next
    chosen: facade + myBrain profile "Fluvoro"; tenant "fluvoro" + API key
    rules_out: step 6 (team and board) for now
  - id: D-08
    question: which of the cloud session's follow-up requests to carry out
    chosen: add F-005..F-008 and the operator / correction / myBrain notes
    rules_out: (for now) messaging Platform audit to announce deploys; per-phase commit pinning
  - id: D-09
    question: how to set up the Fluvoro operator after ADMIN_TENANT_IDS refused tenant fluvoro
    chosen: new user fluvoro-operator in tenant siimplex, dept engineering; key issued by the maintainer
    rules_out: adding fluvoro to ADMIN_TENANT_IDS; reusing rabih/siimplex
  - id: D-10
    question: after F-009 and F-011, carry on or fix first
    chosen: pause the run; ask Platform audit to fix F-009 and F-011 before Phase 1
    rules_out: step 6 plan now; Phase 1 on the current behaviour
    consequence: the fixes are deploys mid-run, so Phase 1 must record served_commit at start and end

